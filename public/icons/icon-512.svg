<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e33"/>
      <stop offset="100%" stop-color="#040d16"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle tech ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e3a5f" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.4"/>

  <!-- Water Drop Base Shape -->
  <path d="M256,60 C256,60 110,230 110,335 C110,415 175,465 256,465 C337,465 402,415 402,335 C402,230 256,60 256,60 Z" 
        fill="url(#waterGrad)" filter="url(#glow)" opacity="0.95"/>

  <!-- Inner highlight curve in water drop -->
  <path d="M256,95 C256,95 135,245 135,335 C135,365 148,390 170,410 C155,385 148,355 150,325 C154,260 256,120 256,95 Z" 
        fill="#ffffff" opacity="0.3"/>

  <!-- Setu (Bridge Arch) Shape -->
  <path d="M150,380 C190,290 322,290 362,380 C335,360 300,345 256,345 C212,345 177,360 150,380 Z" 
        fill="url(#bridgeGrad)"/>

  <!-- Bridge Pillars & Structure -->
  <path d="M195,355 L195,395 M256,345 L256,405 M317,355 L317,395" 
        stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Clean Water Ripple Waves -->
  <path d="M170,415 C210,430 302,430 342,415" 
        fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round"/>
  <path d="M200,438 C230,448 282,448 312,438" 
        fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- Optical Sensor / TinyML Edge Spark -->
  <circle cx="256" cy="220" r="14" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="220" r="6" fill="#10b981"/>
  <path d="M256,190 L256,202 M256,238 L256,250 M226,220 L238,220 M274,220 L286,220" 
        stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
</svg>
