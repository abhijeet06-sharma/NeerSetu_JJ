<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="NeerSetu_JJ (NeerSetu JalJeevan) - Low-cost, rural-first, offline-first water purification monitoring ecosystem with ESP32 edge TinyML & Digital Twin for Jharkhand." />
    
    <!-- PWA Capabilities -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NeerSetu_JJ" />

    <title>NeerSetu_JJ - NeerSetu JalJeevan | Rural Water Monitoring & Digital Twin</title>

    <!-- Google Fonts Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      /* Instant Splash Screen */
      #app-splash {
        position: fixed;
        inset: 0;
        background: #071019;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      .splash-logo-wrap {
        position: relative;
        animation: dropFloat 2.5s infinite ease-in-out;
      }
      @keyframes dropFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      .splash-title {
        color: #ffffff;
        font-family: 'Outfit', 'Inter', system-ui, sans-serif;
        font-size: 1.8rem;
        font-weight: 900;
        margin-top: 18px;
        letter-spacing: -0.5px;
      }
      .splash-title span { color: #38bdf8; }
      .splash-title em { color: #10b981; font-style: normal; }
      .splash-slogan {
        color: #94a3b8;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.95rem;
        margin-top: 4px;
        font-weight: 500;
      }
      .splash-loader {
        width: 140px;
        height: 4px;
        background: #1e3a54;
        border-radius: 2px;
        margin-top: 24px;
        overflow: hidden;
        position: relative;
      }
      .splash-loader-bar {
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #0284c7, #38bdf8);
        border-radius: 2px;
        position: absolute;
        animation: loadSlide 1.2s infinite ease-in-out;
      }
      @keyframes loadSlide {
        0% { left: -45%; }
        100% { left: 100%; }
      }
      .splash-edge-tag {
        margin-top: 20px;
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- Instant Native Splash Screen -->
    <div id="app-splash">
      <div class="splash-logo-wrap">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" fill="#0284c7"/>
          <path d="M8 15c2-3 6-3 8 0" stroke="#ffffff" stroke-width="2"/>
        </svg>
      </div>
      <h1 class="splash-title"><span>NeerSetu</span><em>_JJ</em></h1>
      <div class="splash-slogan">NeerSetu JalJeevan</div>
      <div class="splash-loader"><div class="splash-loader-bar"></div></div>
      <div class="splash-edge-tag">ESP32 TinyML • Offline-First PWA</div>
    </div>

    <!-- Main PWA App Container -->
    <div id="app"></div>

    <script>
      // Fade out splash screen when page loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const splash = document.getElementById('app-splash');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(() => splash.remove(), 400);
          }
        }, 500);
      });
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
